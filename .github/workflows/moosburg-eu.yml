name: Deploy auf moosburg.eu/data/

# Läuft neben dem GitHub-Pages-Workflow in pages.yml auf demselben Branch.
# Die beiden stören sich nicht: Pages nutzt kein FTP.
#
# Unterschiedliche base-Pfade, deshalb ein eigener Build-Befehl:
# Pages liegt unter /datahub/ (Repo-Name), Hostinger unter /data/.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:hostinger

      # Öffentlich ist vorerst nur eine Auswahl. Der Schritt kürzt das
      # Manifest und löscht die zurückgehaltenen Rohdaten aus dist/, damit
      # sie auch nicht über die direkte URL erreichbar sind. Die Quelldaten
      # im Repo bleiben unangetastet — lokal ist weiterhin alles da.
      - name: Nur die Preview-Datensätze ausliefern
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/data/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const keep = new Set(['kommunalwahl_2026', 'christkindlmarkt_2025', 'studie_website_2025', 'bahnhofumfrage_2023', 'volksfest_2024', 'statistik_kommunal_2022']);
            const missing = [...keep].filter(id => !m.datasets.some(d => d.id === id));
            if (missing.length) {
              console.error('Unbekannte Dataset-ID(s): ' + missing.join(', '));
              process.exit(1);
            }
            const drop = m.datasets.filter(d => !keep.has(d.id));
            m.datasets = m.datasets.filter(d => keep.has(d.id));
            fs.writeFileSync(p, JSON.stringify(m, null, 1));
            for (const d of drop) fs.rmSync('dist/data/' + d.file, { force: true });
            console.log('Öffentlich:     ' + m.datasets.map(d => d.id).join(', '));
            console.log('Zurückgehalten: ' + drop.map(d => d.id).join(', '));
          "

      # Die App nutzt createBrowserRouter, echte Pfade also, keine Hashes.
      # Ohne diese Regel liefert der Server bei /data/d/volksfest_2024 einen
      # 404, weil die Datei nicht existiert. Der 404.html-Trick im Repo löst
      # das nur für GitHub Pages; auf Apache/LiteSpeed macht es ein Rewrite.
      # Bewusst hier erzeugt statt in public/: der Pfad /data/ ist eine
      # Eigenheit dieses Hosts, das Repo bleibt davon frei.
      - name: SPA-Fallback für Apache erzeugen
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /data/
          # Eine eigene RewriteEngine schaltet die Regeln der Domain für diesen
          # Ordner ab. Deren Sperre für Pfade mit führendem Punkt (etwa der
          # Sync-Stand des FTP-Deploys) steht deshalb hier noch einmal.
          RewriteRule (^|/)\.(?!well-known/) - [F,L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          # Anfragen mit Dateiendung nicht umschreiben. Sonst beantwortet der
          # Server eine fehlende .json mit der SPA-Shell und HTTP 200 — und ein
          # zurückgehaltener Datensatz sähe aus, als gäbe es ihn noch, bloß mit
          # kaputtem JSON.
          RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{2,5}$
          RewriteRule . /data/index.html [L]
          HTACCESS
          cat dist/.htaccess

      # Eigenes FTP-Konto, in hPanel auf den Ordner data beschränkt: Das
      # Login beginnt dort, deshalb unten server-dir ./. Gehören die Secrets zu
      # einem anderen Konto oder liegt das Login in der Domain-Wurzel, bricht
      # der Deploy hier ab, bevor etwas übertragen wird (moosburg-eu/BRIEFING.md).
      - name: Ziel prüfen
        env:
          KONTO: data
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -o pipefail
          case "$FTP_USER" in
            *"$KONTO") ;;
            *) echo "FTP_USER ist nicht das Konto $KONTO. Abbruch."; exit 1 ;;
          esac
          liste=$(curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" --list-only "ftp://$FTP_HOST/" | tr -d '\r')
          if grep -qx stadtrat <<< "$liste" && grep -qx abstimmung <<< "$liste"; then
            echo "Das Login liegt in der Domain-Wurzel. Abbruch."; exit 1
          fi

      - name: Nach data/ spiegeln
        # v4.4.0, auf den Commit gepinnt: Ein verschobener Tag soll nicht
        # unbemerkt anderen Code an das FTP-Passwort bringen.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Prüft das Zertifikat. FTP_HOST ist deshalb srv1973.hstgr.io: Das
          # Zertifikat lautet auf *.hstgr.io, ftp.moosburg.eu passt nicht dazu.
          security: strict
          local-dir: ./dist/
          server-dir: ./

          # Kurz nach einer anderen Übertragung nimmt Hostinger die Verbindung
          # verzögert an; die 30 s Standard-Timeout reichen dann nicht.
          timeout: 120000
