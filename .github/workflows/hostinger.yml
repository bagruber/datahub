name: Deploy auf moosburg.eu/data/

# Läuft neben dem GitHub-Pages-Workflow in deploy.yml auf demselben Branch.
# Die beiden stören sich nicht: Pages nutzt kein FTP.
#
# Unterschiedliche base-Pfade, deshalb ein eigener Build-Befehl:
# Pages liegt unter /datahub/ (Repo-Name), Hostinger unter /data/.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:hostinger

      # Öffentlich ist vorerst nur eine Auswahl. Der Schritt kürzt das
      # Manifest und löscht die zurückgehaltenen Rohdaten aus dist/, damit
      # sie auch nicht über die direkte URL erreichbar sind. Die Quelldaten
      # im Repo bleiben unangetastet — lokal ist weiterhin alles da.
      - name: Nur die Preview-Datensätze ausliefern
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/data/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const keep = new Set(['bahnhofumfrage_2023', 'volksfest_2024', 'statistik_kommunal_2022']);
            const missing = [...keep].filter(id => !m.datasets.some(d => d.id === id));
            if (missing.length) {
              console.error('Unbekannte Dataset-ID(s): ' + missing.join(', '));
              process.exit(1);
            }
            const drop = m.datasets.filter(d => !keep.has(d.id));
            m.datasets = m.datasets.filter(d => keep.has(d.id));
            fs.writeFileSync(p, JSON.stringify(m, null, 1));
            for (const d of drop) fs.rmSync('dist/data/' + d.file, { force: true });
            console.log('Öffentlich:     ' + m.datasets.map(d => d.id).join(', '));
            console.log('Zurückgehalten: ' + drop.map(d => d.id).join(', '));
          "

      # Die App nutzt createBrowserRouter, echte Pfade also, keine Hashes.
      # Ohne diese Regel liefert der Server bei /data/d/volksfest_2024 einen
      # 404, weil die Datei nicht existiert. Der 404.html-Trick im Repo löst
      # das nur für GitHub Pages; auf Apache/LiteSpeed macht es ein Rewrite.
      # Bewusst hier erzeugt statt in public/: der Pfad /data/ ist eine
      # Eigenheit dieses Hosts, das Repo bleibt davon frei.
      - name: SPA-Fallback für Apache erzeugen
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteBase /data/
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          # Anfragen mit Dateiendung nicht umschreiben. Sonst beantwortet der
          # Server eine fehlende .json mit der SPA-Shell und HTTP 200 — und ein
          # zurückgehaltener Datensatz sähe aus, als gäbe es ihn noch, bloß mit
          # kaputtem JSON.
          RewriteCond %{REQUEST_URI} !\.[a-zA-Z0-9]{2,5}$
          RewriteRule . /data/index.html [L]
          HTACCESS
          cat dist/.htaccess

      - name: Nach data/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: data/

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000
