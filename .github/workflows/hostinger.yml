name: Deploy auf moosburg.eu/datahub/

# Neben dem GitHub-Pages-Workflow in deploy.yml. Der läuft auf main,
# dieser auf revamp — dort steht der aktuelle Stand.
on:
  push:
    branches: [revamp]
  workflow_dispatch:

concurrency:
  group: deploy-datahub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Öffentlich ist vorerst nur eine Auswahl. Der Schritt kürzt das
      # Manifest und löscht die zurückgehaltenen Rohdaten aus dist/, damit
      # sie auch nicht über die direkte URL erreichbar sind. Die Quelldaten
      # im Repo bleiben unangetastet — lokal ist weiterhin alles da.
      - name: Nur die Preview-Datensätze ausliefern
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/data/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const keep = new Set(['bahnhofumfrage_2023', 'volksfest_2024', 'statistik_kommunal_2022']);
            const missing = [...keep].filter(id => !m.datasets.some(d => d.id === id));
            if (missing.length) {
              console.error('Unbekannte Dataset-ID(s): ' + missing.join(', '));
              process.exit(1);
            }
            const drop = m.datasets.filter(d => !keep.has(d.id));
            m.datasets = m.datasets.filter(d => keep.has(d.id));
            fs.writeFileSync(p, JSON.stringify(m, null, 1));
            for (const d of drop) fs.rmSync('dist/data/' + d.file, { force: true });
            console.log('Öffentlich:     ' + m.datasets.map(d => d.id).join(', '));
            console.log('Zurückgehalten: ' + drop.map(d => d.id).join(', '));
          "

      - name: Nach datahub/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: datahub/

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000
