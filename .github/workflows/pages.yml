name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build

      # Die Einzelantworten der Innovationen-Befragung bleiben im Repo, weil die
      # Studienseite daraus rechnet. Ausgeliefert werden sie hier so wenig wie
      # auf moosburg.eu. Fehlt der Eintrag, bricht der Schritt ab, statt eine
      # umbenannte Datei still durchzulassen.
      - name: Einzelantworten der Innovationen-Befragung zurückhalten
        run: |
          node -e "
            const fs = require('fs');
            const p = 'dist/data/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            const id = 'website_innovationen_2025';
            const e = m.datasets.find(d => d.id === id);
            if (!e) { console.error('Nicht im Manifest: ' + id); process.exit(1); }
            m.datasets = m.datasets.filter(d => d.id !== id);
            fs.writeFileSync(p, JSON.stringify(m, null, 1));
            fs.rmSync('dist/data/' + e.file);
            console.log('Zurückgehalten: ' + id);
          "

      - name: Sanity-check dist/
        run: |
          echo "── dist root ─────────────────────"
          ls -la dist
          echo "── dist/assets ──────────────────"
          ls -la dist/assets | head -20
          echo "── dist/data ────────────────────"
          ls -la dist/data
          echo "── index.html (first 40 lines) ──"
          head -40 dist/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
